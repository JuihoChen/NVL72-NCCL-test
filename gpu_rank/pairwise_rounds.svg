<text x="320" y="300" text-anchor="middle" font-size="12" font-weight="normal" fill="#444">8 GPUs shown for clarity. The rack uses 72 GPUs and 71 rounds (k = 1 to 71).</text><text x="320" y="322" text-anchor="middle" font-size="12" font-weight="normal" fill="#444">In every round all GPUs send 1 GiB at the same time, each to one partner and from one partner.</text><text x="320" y="344" text-anchor="middle" font-size="12" font-weight="normal" fill="#444">After all rounds, every GPU has sent to and received from every other GPU once.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>